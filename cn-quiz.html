[57,"OSI layers and functions","<b>Physical</b>: bit transmission, signals. <b>Data link</b>: framing, MAC addressing, error/flow control. <b>Network</b>: logical addressing, routing. <b>Transport</b>: end-to-end delivery, segmentation, reliability. <b>Session</b>: dialog control, synchronization. <b>Presentation</b>: translation, encryption, compression. <b>Application</b>: user services (mail, web, file transfer)."],

[60,"Switch vs Router","<b>Switch</b>: Layer 2, uses MAC addresses, connects devices inside one LAN, one broadcast domain (unless VLANs), very fast.<br><b>Router</b>: Layer 3, uses IP addresses and routing tables, connects different networks, separates broadcast domains, offers NAT/firewall."],

[108,"Explain topologies with uses","<b>Mesh</b>: dedicated links, robust – backbones.<br><b>Star</b>: central hub/switch, easy management – office LANs.<br><b>Bus</b>: single shared cable, cheap – small/legacy LANs.<br><b>Ring</b>: each node linked to two neighbors, token passing – FDDI/legacy MANs.<br><b>Tree/Hybrid</b>: campuses and large organizations."],
[109,"Types of transmission media","<b>Guided</b>: twisted pair (UTP/STP), coaxial cable, fiber-optic cable.<br><b>Unguided (wireless)</b>: radio waves, microwaves, infrared, satellite."],
[110,"Primary functions of Physical layer","Bit encoding and signaling, data rate, synchronization, physical topology, transmission mode and interface to the media (see Q61)."],
[111,"6 devices in a mesh: cables and ports per device","Cables = n(n−1)/2 = 6×5/2 = <b>15</b><br>Ports per device = n−1 = <b>5</b>"],
[112,"Modes of propagating light in optical channels","<b>Multimode step-index</b>: rays reflect off core–cladding boundary; pulses spread (modal dispersion).<br><b>Multimode graded-index</b>: refractive index varies, rays refocus; less distortion.<br><b>Single mode</b>: very thin core, one ray travels straight; lowest dispersion, long distance."],
[113,"Guided vs unguided media","Guided: signal confined to a physical conductor (cable, fiber); more secure, less interference. Unguided: signal travels through air/vacuum, broadcast to all, supports mobility but is prone to interference and eavesdropping."],
[114,"Short note: Coaxial cable","Central copper conductor, insulator, braided metal shield, outer jacket; uses BNC connectors. Better shielding and bandwidth than twisted pair; thinnet/thicknet types. Used in cable TV and older Ethernet; bulky and easy to tap."],
[115,"Short note: Fiber cable","Glass/plastic core, cladding, buffer, jacket; sends light by total internal reflection. Huge bandwidth, low attenuation, immune to EMI, secure. Costly, fragile, hard to install. Used in backbones and long-distance links."],
[116,"Short note: Radio communication","Radio waves (3 kHz–1 GHz) are omnidirectional and pass through walls, so no line of sight or dishes needed. Used in AM/FM radio, cordless phones, paging. Prone to interference; low frequencies use ground or sky propagation."]

[136,"Stop-and-wait is same as sliding window with window size ___","<b>1</b> (sender sends one frame and waits for ACK)."],
[137,"Number of ACK sent by receiver on receiving packet 8","The ACK carries the next expected frame number → <b>9</b>."],
[138,"Receiver window of Go-Back-N when sender window is 9","GBN receiver window is always <b>1</b>."],
[139,"Sent 0100010001000011, received 0101110101000011: burst length","Differences at bit positions 4, 5 and 8 (from left).<br>Burst length = first to last error = 8 − 4 + 1 = <b>5 bits</b>"],
[140,"Convert x^5 + x + 1 to binary","Coefficients for x^5..x^0 = 1,0,0,0,1,1 → <b>100011</b>"],
[141,"CRC: sent data 100100001, original data 6 bits: key size","Total 9 bits − 6 data = 3 CRC bits = key length − 1 → key = <b>4 bits</b>"],
[142,"Stop-and-wait, every 4th transmission lost, 10 packets: total transmissions","Let T be transmissions; ⌊T/4⌋ are lost.<br>T − ⌊T/4⌋ = 10 → T = 13 (13 − 3 = 10).<br><b>13 transmissions</b>"],
[143,"Checksum of 0101 0011 1000","0101+0011 = 1000; 1000+1000 = 10000 → wrap carry: 0000+1 = 0001<br>One's complement = <b>1110</b>"],
[144,"Hamming (even parity) for 0100110; find error in 01010010001","Positions counted from the right (book convention); parity at 1,2,4,8; data 0100110 at positions 11,10,9,7,6,5,3.<br>P1 (3,5,7,9,11): 0,1,0,0,0 → 1<br>P2 (3,6,7,10,11): 0,1,0,1,0 → 0<br>P4 (5,6,7): 1,1,0 → 0<br>P8 (9,10,11): 0,1,0 → 1<br><b>Codeword = 01010110001</b><br>Received 01010010001 differs at bit 6 → <b>error at position 6</b>"],
[145,"LRC of 11100111 11011101 00111001 10101001","Column-wise XOR (even parity):<br>11100111 ⊕ 11011101 = 00111010<br>⊕ 00111001 = 00000011<br>⊕ 10101001 = <b>10101010</b>"],
[146,"CRC of M=1010001101 with x^5+x^4+x^2+1; is 101000110101100 error-free?","Divisor = 110101. Append 5 zeros: 101000110100000.<br>Mod-2 division gives remainder <b>01110</b> → transmitted codeword 1010001101<b>01110</b>.<br>Received ends with 01100 ≠ 01110, so its remainder is non-zero → <b>No</b>"],
[147,"Checksum of 10011001 11100010 00100100 10000100","10011001+11100010 = 01111011 + carry 1 = 01111100<br>+00100100 = 10100000<br>+10000100 = 00100100 + carry 1 = 00100101<br>Complement = <b>11011010</b>"],
[148,"RTT in stop-and-wait if propagation delay 3.7 ms","RTT = 2×Tp = <b>7.4 ms</b>"],
[149,"Hamming code: 7 data bits → redundant bits","Need 2^r ≥ m + r + 1: r=3 → 8 ≥ 11 ✗; r=4 → 16 ≥ 12 ✓ → <b>4 bits</b>"],
[150,"Even-parity Hamming received 10010100101: locate and correct error","Positions from the right: 11..1 = 1,0,0,1,0,1,0,0,1,0,1.<br>P1 (1,3,5,7,9,11) → odd ✗; P2 (2,3,6,7,10,11) → odd ✗; P4 (4,5,6,7) → odd ✗; P8 (8,9,10,11) → even ✓<br>Error position = 1+2+4 = <b>7</b>. Flip it → corrected data <b>10011100101</b>"],
[151,"4 ESC received: how many discarded","Every ESC inserted by the sender is removed by the receiver: <b>2 ESC discarded</b> (the other 2 are data)."],
[152,"Stop-and-wait: ACK lost","Sender's timer expires, it <b>retransmits the same frame</b>; receiver detects the duplicate by sequence number, discards it and sends the ACK again."],
[153,"CRC: bit stream 10011101, generator x^3+1","Divisor 1001; append 3 zeros: 10011101000.<br>Mod-2 division → remainder <b>100</b>.<br>Transmitted: <b>10011101100</b>"],
[154,"Codeword 100100001, key 1101: error?","Divide 100100001 by 1101 (mod 2): remainder = 000.<br><b>No error</b>"],
[155,"Byte stuffing: ESC added when data has ESC-like bytes","One extra ESC is inserted before every flag/ESC-like byte in the data, so an ESC in the data is sent as ESC ESC (2 ESC bytes on the wire)."],
[156,"CRC: bit stream 1101011011, generator x^4+x+1","Divisor 10011; append 4 zeros: 11010110110000.<br>Mod-2 division → remainder <b>1110</b>.<br>Transmitted: <b>11010110111110</b>"],
[157,"Codeword 100000001, key 1101: error?","Dividing 100000001 by 1101 (mod 2) leaves remainder 011 ≠ 0.<br><b>Error detected</b>"],
[158,"How many MAC addresses are available","48-bit address → 2^48 = <b>281,474,976,710,656</b> addresses."],
[159,"Encode 1011 with (7,4) Hamming","Layout: P1 P2 D3 P4 D5 D6 D7 with D3=1, D5=0, D6=1, D7=1.<br>P1 (3,5,7) = 1⊕0⊕1 = 0<br>P2 (3,6,7) = 1⊕1⊕1 = 1<br>P4 (5,6,7) = 0⊕1⊕1 = 0<br>Codeword = <b>0110011</b>"],
[160,"Received Hamming word 1010111: error?","Bits 1..7 = 1,0,1,0,1,1,1.<br>P1 (1,3,5,7): 1,1,1,1 → even ✓<br>P2 (2,3,6,7): 0,1,1,1 → odd ✗<br>P4 (4,5,6,7): 0,1,1,1 → odd ✗<br>Error position = 2+4 = <b>6</b> (corrected: 1010101)"],
[161,"Hamming word 1101101: parity checks and errors","Bits 1..7 = 1,1,0,1,1,0,1.<br>P1 (1,3,5,7): 1,0,1,1 → 1 (odd ✗)<br>P2 (2,3,6,7): 1,0,0,1 → 0 ✓<br>P4 (4,5,6,7): 1,1,0,1 → 1 ✗<br>(P8 not applicable for 7 bits.)<br>Error position = 1+4 = <b>5</b>"],
[162,"Go-Back-4: every 6th transmission lost, 10 packets: transmissions","t1–t5 = pkts 1–5, t6 = pkt 6 lost; pkts 7–9 discarded → 9 sent.<br>Timeout: resend 6,7,8,9,10: t10=6, t11=7, t12=8 lost, t13=9 and t14=10 discarded.<br>Timeout: resend 8,9,10 = 3 more.<br>Total = 14 + 3 = <b>17 transmissions</b>"]

[198,"Pure ALOHA, 200-bit frames, 200 kbps, 1000 frames/s: throughput","Tfr = 200/200,000 = 1 ms; G = 1000×1 ms = 1.<br>S = G·e^(−2G) = e^−2 = 0.135<br>Throughput = 1000×0.135 = <b>≈ 135 frames/s</b>"],
[199,"Same, 500 frames/s","G = 0.5; S = 0.5·e^−1 = 0.184<br>Throughput = 500×e^−1 = <b>≈ 184 frames/s</b>"],
[200,"Same, 250 frames/s","G = 0.25; e^(−0.5) = 0.6065<br>Throughput = 250×0.6065 = <b>≈ 152 frames/s</b>"],
[201,"Pure ALOHA, 100 stations, Tfr = 1 µs: frames per station for max efficiency","Max at G = 0.5 (0.5 frames per Tfr overall).<br>Total = 0.5/1 µs = 500,000 frames/s → per station = <b>5000 frames/s</b>"],
[202,"Pure ALOHA, 1000-bit frames, 1 Mbps, 1000 frames/s offered: throughput","Tfr = 1 ms; G = 1; S = e^−2 = 0.1353<br>Throughput = 1000×0.1353 = <b>≈ 135 frames/s</b>"],
[203,"Tfr = 20 ms, G = 1: frames generated in 1 s, for pure and slotted ALOHA","G = 1 → 1 frame per 20 ms → <b>50 frames generated</b> (both).<br>Pure: 50×e^−2 = <b>≈ 6.8</b> succeed. Slotted: 50×e^−1 = <b>≈ 18.4</b> succeed."],
[204,"Slotted ALOHA, 100 stations, Tfr = 1 µs: frames per station for max efficiency","Max at G = 1 → 10^6 frames/s total.<br>Per station = <b>10,000 frames/s</b>"],
[205,"Slotted ALOHA, 200-bit frames, 200 kbps, 1000 frames/s","Tfr = 1 ms; G = 1; S = G·e^−G = 0.368<br>Throughput = <b>≈ 368 frames/s</b>"],
[206,"Same, 500 frames/s","G = 0.5; 500×e^(−0.5) = 500×0.6065 = <b>≈ 303 frames/s</b>"],
[207,"Same, 250 frames/s","G = 0.25; 250×e^(−0.25) = 250×0.7788 = <b>≈ 195 frames/s</b>"],
[208,"Tp = 2 ms: find TB (back-off) for K = 1, 2, 3","TB = R × Tp, R ∈ [0, 2^K − 1].<br>K=1: R ∈ {0,1} → TB = 0 or 2 ms<br>K=2: R ∈ {0..3} → 0, 2, 4, 6 ms<br>K=3: R ∈ {0..7} → 0, 2, 4, … , 14 ms"],
[209,"Pure ALOHA, 200-bit frames at 200 kbps: requirement for collision-free frame","Tfr = 1 ms. Vulnerable time = 2×Tfr = <b>2 ms</b>: no other station may send during the 1 ms before or the 1 ms after the frame starts."],
[210,"CSMA/CD, 10 Mbps, max propagation time 25.6 µs: minimum frame size","Tfr ≥ 2×Tp = 51.2 µs<br>Size = 10×10^6 × 51.2×10^-6 = 512 bits = <b>64 bytes</b>"],
[211,"CSMA/CD, after 3rd collision: P(k = 2)","k ∈ {0 … 2^3 − 1} = 8 values<br>P = <b>1/8 = 0.125</b>"],
[212,"After 4th collision: P(K = 5); delay with Tfr = 0.125 µs","k ∈ {0 … 15} = 16 values → P = <b>1/16 = 0.0625</b><br>Delay = K×Tfr = 5×0.125 µs = <b>0.625 µs</b> (6.25×10^-7 s)"],
[213,"After 6th collision: P(k = 10); delay with Tfr = 0.5 µs","k ∈ {0 … 63} = 64 values → P = <b>1/64 = 0.0156</b><br>Delay = 10×0.5 µs = <b>5 µs</b> (5×10^-6 s)"]
